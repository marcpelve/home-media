# Home Media — build, sign, and publish a release.
#
# Triggered by pushing a semver tag (e.g. `v1.2.3`). The tag name becomes the
# GitHub Release name, and the Tauri updater manifest is generated from it.
#
# Required repo secret (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY
#     The base64-encoded minisign private key (the one printed by
#     `tauri signer generate`). The matching public key is already embedded in
#     tauri.conf.json. If the key has a password, also set
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#
# GITHUB_TOKEN is provided automatically.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build the FastAPI backend into a PyInstaller one-dir bundle, mirroring
      # desktop/build-tauri-msvc.bat. The NSIS installer then ships this bundle
      # as a bundled resource (resources/home-media).
      - name: Build PyInstaller backend (one-dir)
        shell: bash
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          pyinstaller backend.spec --noconfirm --distpath dist

      # Stage the one-dir where Tauri expects its bundled resource.
      - name: Stage backend into Tauri resources
        shell: bash
        run: |
          rm -rf desktop/src-tauri/resources/home-media
          mkdir -p desktop/src-tauri/resources
          cp -r backend/dist/home-media desktop/src-tauri/resources/home-media

      # Build the frontend: the package.json build script copies src/ -> dist/,
      # which is the frontendDist Tauri bundles. No npm deps are required.
      - name: Build frontend (src -> dist)
        shell: bash
        working-directory: desktop
        run: npm run build

      # Build the NSIS installer, sign it, create the GitHub release, and
      # upload the signed artifacts + updater manifest. tauri-action handles
      # all of this when given tagName + releaseName.
      - name: Build and sign installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop/src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: Home Media ${{ github.ref_name }}
          includeUpdaterJson: false

      # tauri-action@v0 only uploads the main .exe and skips the signatures +
      # updater manifest, so upload those to the release it created here.
      - name: Sign and upload updater assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          NSIS="desktop/src-tauri/target/release/bundle/nsis"
          BUNDLE="desktop/src-tauri/target/release/bundle"
          EXE="$NSIS/Home Media_${VERSION}_x64-setup.exe"
          ZIP="$NSIS/Home Media_${VERSION}_x64-setup.nsis.zip"

          echo "PWD: $(pwd)"
          echo "--- NSIS dir (before signing) ---"
          ls -la "$NSIS" || { echo "::error::NSIS dir missing"; exit 1; }

          if [ ! -f "$EXE" ]; then
            echo "::error::Installer not found: $EXE"
            exit 1
          fi

          # tauri build did not sign the bundles, so sign them here.
          command -v tauri >/dev/null 2>&1 || npm install -g @tauri-apps/cli@v2

          # Write the key to a temp file for --private-key-path.
          # TAURI_SIGNING_PRIVATE_KEY is already base64-encoded — write it as-is.
          KEY_FILE="$(mktemp)"
          echo "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_FILE"

          # Create the updater zip (the .exe zipped) and sign both files.
          # Use Python's zipfile module — the Windows runner has no `zip` binary.
          python -c "
          import zipfile, os
          nsis = '$NSIS'
          exe = os.path.join(nsis, 'Home Media_${VERSION}_x64-setup.exe')
          zip_path = os.path.join(nsis, 'Home Media_${VERSION}_x64-setup.nsis.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as z:
              z.write(exe)
          "
          # Unset the env var so the CLI doesn't auto-detect it as --private-key
          # (conflicts with --private-key-path).
          unset TAURI_SIGNING_PRIVATE_KEY
          tauri signer sign --private-key-path "$KEY_FILE" --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" "$EXE"
          tauri signer sign --private-key-path "$KEY_FILE" --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" "$ZIP"
          rm -f "$KEY_FILE"

          echo "--- NSIS dir (after signing) ---"
          ls -la "$NSIS"

          # Upload signatures + updater zip (dot-named to match the manifest URL).
          for f in \
            "Home Media_${VERSION}_x64-setup.exe.sig" \
            "Home Media_${VERSION}_x64-setup.nsis.zip.sig"; do
            echo "Uploading: $f"
            gh release upload "$TAG" "$NSIS/$f" --clobber
          done
          ZIP_DST="$BUNDLE/Home.Media_${VERSION}_x64-setup.nsis.zip"
          cp "$ZIP" "$ZIP_DST"
          echo "Uploading: $(basename "$ZIP_DST")"
          gh release upload "$TAG" "$ZIP_DST" --clobber

          # Updater manifest (latest.json), built from the .nsis.zip signature.
          SIG=$(cat "$NSIS/Home Media_${VERSION}_x64-setup.nsis.zip.sig" | tr -d '[:space:]')
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg sig "$SIG" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: ("Home Media v" + $version), pub_date: $pub_date, url: ("https://github.com/marcpelve/home-media/releases/download/" + $tag + "/Home.Media_" + $version + "_x64-setup.nsis.zip"), signature: $sig}' \
            > "$BUNDLE/latest.json"
          echo "latest.json:"
          cat "$BUNDLE/latest.json"
          echo "Uploading: latest.json"
          gh release upload "$TAG" "$BUNDLE/latest.json" --clobber

          echo "Release: https://github.com/marcpelve/home-media/releases/tag/$TAG"


