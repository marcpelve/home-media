# Home Media — build, sign, and publish a release.
#
# Triggered by pushing a semver tag (e.g. `v1.2.3`). The tag name becomes the
# GitHub Release name, and the Tauri updater manifest is generated from it.
#
# Required repo secret (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY
#     The base64-encoded minisign private key (the one printed by
#     `tauri signer generate`). The matching public key is already embedded in
#     tauri.conf.json. If the key has a password, also set
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#
# GITHUB_TOKEN is provided automatically.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build the FastAPI backend into a PyInstaller one-dir bundle, mirroring
      # desktop/build-tauri-msvc.bat. The NSIS installer then ships this bundle
      # as a bundled resource (resources/home-media).
      - name: Build PyInstaller backend (one-dir)
        shell: bash
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          pyinstaller backend.spec --noconfirm --distpath dist

      # Stage the one-dir where Tauri expects its bundled resource.
      - name: Stage backend into Tauri resources
        shell: bash
        run: |
          rm -rf desktop/src-tauri/resources/home-media
          mkdir -p desktop/src-tauri/resources
          cp -r backend/dist/home-media desktop/src-tauri/resources/home-media

      # Build the frontend: the package.json build script copies src/ -> dist/,
      # which is the frontendDist Tauri bundles. No npm deps are required.
      - name: Build frontend (src -> dist)
        shell: bash
        working-directory: desktop
        run: npm run build

      # Build the NSIS installer and sign it with the minisign key.
      # tauri-action handles the build + signing; the release upload is done
      # in the next step because tauri-action@v0 silently skips uploads.
      - name: Build and sign installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectName: home-media
          tauriDir: desktop/src-tauri
          includeUpdaterManifest: true

      # Create the GitHub Release and upload the signed artifacts.
      - name: Create release and upload artifacts
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag: $TAG"

          BUNDLE="desktop/src-tauri/target/release/bundle"
          NSIS="$BUNDLE/nsis"

          # Collect the files to upload
          FILES=()
          for f in \
            "Home Media_0.1.0_x64-setup.exe" \
            "Home Media_0.1.0_x64-setup.exe.sig" \
            "Home Media_0.1.0_x64-setup.nsis.zip" \
            "Home Media_0.1.0_x64-setup.nsis.zip.sig"; do
            if [ -f "$NSIS/$f" ]; then
              FILES+=("$NSIS/$f")
            fi
          done

          # Include the updater manifest if tauri-action generated one
          for manifest in "$BUNDLE/latest.json" "$BUNDLE/updater-manifest.json"; do
            if [ -f "$manifest" ]; then
              FILES+=("$manifest")
            fi
          done

          echo "Uploading: ${FILES[*]}"

          gh release create "$TAG" \
            --title "Home Media $TAG" \
            --notes "Home Media $TAG

            Install the .exe (NSIS) for Windows x64. The app updates itself
            from this release feed — no manual re-download needed." \
            --target "${{ github.sha }}" \
            "${FILES[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
