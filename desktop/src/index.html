<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>home-media</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="back" class="back hidden" title="Back" aria-label="Back">&#8592;</button>
    <div class="logo" id="home" title="Home">home<span>media</span></div>
    <button id="library" class="liblink" title="My Library" aria-label="My Library">Library</button>
    <input id="search" type="search" placeholder="Search movies &amp; shows..." autocomplete="off" />
    <div class="svc-status" id="svc-status" role="status" aria-live="polite"></div>
    <button id="settings" class="icon" title="Settings" aria-label="Settings">&#9881;</button>
    <button id="power" class="icon" title="Sync and quit" aria-label="Sync and quit">&#9211;</button>
    </header>
  <main id="app"></main>
  <div class="kbd-hint">&larr; &rarr; &uarr; &darr; move &middot; Enter select &middot; Backspace back &middot; / search &middot; s settings</div>
  <script src="main.js?v=2"></script>
</body>
</html>
